name: Deploy

# Automatic on merge to the deployment branch, and manual from the Actions tab.
#
# Requires four repository secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST       the droplet's public IP
#   DEPLOY_USER       the SSH user (a dedicated deploy user, not root - see docs)
#   DEPLOY_SSH_KEY    that user's PRIVATE key, whole file including the header
#   DEPLOY_PATH       where the checkout lives, e.g. /opt/ivr
#
# Deploying to a phone system is not like deploying a website: a bad restart
# means callers hear nothing. scripts/deploy.sh guards this by building before
# it stops anything, draining calls in progress, verifying that Asterisk
# accepted the app back, and rolling back if it did not.

on:
  push:
    # main does not exist yet - the work lives on the feature branch. Once it
    # is merged, drop the second entry.
    branches:
      - main
      - claude/advanced-ivr-system-fg16oc
  workflow_dispatch:

concurrency:
  # Never let two deploys touch the server at once.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Is deployment configured?
        id: cfg
        # Until the secrets exist there is nothing to deploy to. Failing the
        # job in that state emails the owner on every single push about a
        # deployment they never set up, which trains them to ignore the one
        # message that will matter later. Skip cleanly instead; this starts
        # working by itself the moment the secrets are added.
        run: |
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy secrets are not configured - skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm

      # Fail here rather than on the server. A build that breaks in CI must
      # never get as far as restarting the service that answers the phone.
      - if: steps.cfg.outputs.configured == 'true'
        run: npm ci
      - if: steps.cfg.outputs.configured == 'true'
        run: npm run typecheck
      - if: steps.cfg.outputs.configured == 'true'
        run: npm run build

      - name: Configure SSH
        if: steps.cfg.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        if: steps.cfg.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          PATH_ON_SERVER: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "${SSH_USER}@${HOST}" \
            "sudo ${PATH_ON_SERVER:-/opt/ivr}/scripts/deploy.sh"

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
