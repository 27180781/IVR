;
; ari.conf - Asterisk REST Interface users.
;
; The password is substituted at deploy time from asterisk/asterisk.env
; (ARI_PASSWORD). Never commit the real value.
;

[general]
enabled = yes
pretty = no
; Websocket write timeout in ms. Raise if you see "write timeout" on busy nodes.
websocket_write_timeout = 100

[ivr]
type = user
read_only = no
password = {{ARI_PASSWORD}}
password_format = plain
