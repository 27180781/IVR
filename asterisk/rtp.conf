;
; rtp.conf - RTP media port range.
;
; These UDP ports must be open in the firewall AND in any cloud security group.
; Budget ~2 ports per concurrent call; 10000-20000 comfortably covers a few
; thousand simultaneous channels.
;

[general]
rtpstart = 10000
rtpend = 20000
icesupport = no
strictrtp = yes
