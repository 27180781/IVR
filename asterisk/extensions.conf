;
; extensions.conf
;
; Deliberately almost empty. All IVR logic lives in the Node application and
; is reached through Stasis(). If you find yourself adding branching logic
; here, that is a signal it belongs in src/ivr/ instead.
;

[general]
static = yes
writeprotect = yes

[globals]
IVR_APP = ivr-app

[from-twilio]
; Twilio puts the dialed E.164 number in the SIP Request-URI user part.
exten => _[+0-9].,1,NoOp(Inbound from Twilio: ${CALLERID(num)} -> ${EXTEN})
    same => n,Set(CHANNEL(language)=he)
    same => n,Set(CHANNEL(hangup_handler_push)=hangup-handler,s,1)
    ; Hand the channel to the Node application. Arguments arrive in the
    ; StasisStart event as event.args.
    same => n,Stasis(${IVR_APP},${EXTEN},${CALLERID(num)})
    ; Only reached if the app is down or rejected the channel.
    same => n,NoOp(Stasis returned - IVR application unavailable)
    same => n,Playback(ivr/system-unavailable)
    same => n,Hangup()

; Fallback if the Request-URI user is not a number at all.
exten => _.,1,NoOp(Unrecognised inbound extension: ${EXTEN})
    same => n,Hangup(21)

[hangup-handler]
exten => s,1,NoOp(Call ended: ${UNIQUEID} cause=${HANGUPCAUSE} duration=${CDR(duration)}s)
    same => n,Return()
