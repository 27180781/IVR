;
; modules.conf - which modules Asterisk loads.
;
; The reason this file exists is chan_sip.
;
; Debian and Ubuntu ship Asterisk with autoload=yes and no modules.conf of
; their own, so the deprecated chan_sip module loads and binds UDP 5060 - the
; same port res_pjsip wants. chan_sip wins, and every inbound call is handled
; by a module we do not configure. Its packaged sip.conf defaults to
; context=public, so Twilio's calls are rejected with:
;
;   chan_sip.c: Call from '' (54.244.51.1:5060) to extension '+1...'
;               rejected because extension not found in context 'public'
;
; Nothing in pjsip.conf is wrong when that happens - it is simply never
; consulted. This is a two-SIP-stacks problem, not a configuration problem,
; and the only fix is to stop loading the stack we do not use.
;

[modules]
autoload = yes

; The old SIP channel driver. Deprecated in Asterisk 17 and removed in 21.
; This project uses res_pjsip exclusively.
noload => chan_sip.so

; Not used, and each one is a listening surface we would rather not have.
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_unistim.so
