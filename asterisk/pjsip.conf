;
; pjsip.conf - Twilio Elastic SIP Trunking <-> Asterisk
;
; Deployed to /etc/asterisk/pjsip.conf by scripts/deploy-asterisk.sh
; Placeholders wrapped in {{ }} are substituted from asterisk/asterisk.env.
;
; IMPORTANT: Twilio publishes its SIP signaling IP ranges and they DO change.
; Verify the list below against the current Twilio documentation before going
; live, and re-check it periodically. An outdated ACL means dropped calls.
;

;==============================================================================
; Transport
;==============================================================================
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Required when Asterisk sits behind NAT (cloud VMs almost always do).
; Set both to the server's PUBLIC IP.
external_media_address = {{PUBLIC_IP}}
external_signaling_address = {{PUBLIC_IP}}
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16

;==============================================================================
; Twilio endpoint (inbound = "origination" in Twilio terminology)
;==============================================================================
[twilio]
type = endpoint
context = from-twilio
; Twilio Elastic SIP Trunking speaks G.711. Pinning the codec avoids
; transcoding, which is the single biggest CPU cost per concurrent call.
disallow = all
allow = ulaw
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes
; Twilio signals DTMF as RFC 2833 telephone-events.
dtmf_mode = rfc4733
; Keeps the IVR alive if the caller's audio path stalls.
rtp_timeout = 60
rtp_timeout_hold = 300
language = {{IVR_LANGUAGE}}
aors = twilio
; Outbound only. Twilio identifies which trunk a call belongs to by the domain
; in the From header, so this must be the Termination SIP Domain exactly.
from_domain = {{TWILIO_TERMINATION_DOMAIN}}

[twilio]
type = aor
; Where outbound calls are sent (Twilio "termination"). Set
; TWILIO_TERMINATION_DOMAIN in asterisk/asterisk.env to your Termination SIP
; Domain, e.g. your-trunk.pstn.twilio.com
;
; Twilio will not accept outbound calls until this server's public IP is in an
; IP Access Control List attached to the trunk's Termination settings. Without
; it every outbound call is rejected, and the rejection does not say why.
contact = sip:{{TWILIO_TERMINATION_DOMAIN}}:5060
qualify_frequency = 60

;==============================================================================
; Identify inbound traffic by source IP.
;
; This is the security boundary: Asterisk accepts SIP for [twilio] ONLY from
; these networks. Everything else falls through to no endpoint and is rejected.
;==============================================================================
[twilio]
type = identify
endpoint = twilio
; --- North America ---
match = 54.172.60.0/30
match = 54.244.51.0/30
; --- Europe ---
match = 54.171.127.192/30
match = 35.156.191.128/30
; --- Asia Pacific ---
match = 54.169.127.128/30
match = 54.65.63.192/30
match = 54.252.254.64/30
; --- South America ---
match = 177.71.206.192/30

;==============================================================================
; Belt and braces: reject anything that is not Twilio before it reaches
; endpoint matching at all.
;==============================================================================
[twilio-acl]
type = acl
deny = 0.0.0.0/0
permit = 54.172.60.0/30
permit = 54.244.51.0/30
permit = 54.171.127.192/30
permit = 35.156.191.128/30
permit = 54.169.127.128/30
permit = 54.65.63.192/30
permit = 54.252.254.64/30
permit = 177.71.206.192/30
