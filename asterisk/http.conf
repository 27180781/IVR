;
; http.conf - HTTP server that serves ARI.
;
; Bound to loopback on purpose: the IVR application runs on this same host.
; If you ever move the app to another machine, do NOT open 8088 to the world -
; put it on a private network or an SSH/WireGuard tunnel and use TLS.
;

[general]
enabled = yes
bindaddr = 127.0.0.1
bindport = 8088
prefix =
enablestatic = no
